<!DOCTYPE html>
<html lang="id" data-theme="cupcake">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Our Moments</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-base-200 min-h-screen pb-10">

    <div class="navbar bg-base-100 shadow-md px-4 md:px-10">
        <div class="flex-1">
            <a class="btn btn-ghost text-xl">Admin Panel ❤️</a>
        </div>
        <div class="flex-none">
            <button id="logoutBtn" class="btn btn-outline btn-error btn-sm">Logout</button>
        </div>
    </div>

    <div class="max-w-4xl mx-auto mt-8 px-4">
        <div class="card bg-base-100 shadow-xl mb-10">
            <div class="card-body">
                <h2 class="card-title mb-4">Upload Postingan Baru (Carousel)</h2>
                <form id="uploadForm" class="space-y-4">
                    <div class="form-control">
                        <label class="label"><span class="label-text">Pilih Foto/Video (Bisa banyak sekaligus)</span></label>
                        <input type="file" id="fileInput" class="file-input file-input-bordered file-input-secondary w-full" accept="image/*,video/*" multiple required />
                    </div>
                    <div class="form-control">
                        <label class="label"><span class="label-text">Caption Postingan</span></label>
                        <textarea id="captionInput" class="textarea textarea-bordered h-24" placeholder="Tulis cerita di sini..." required></textarea>
                    </div>
                    <button type="submit" id="submitBtn" class="btn btn-secondary w-full text-white">Upload Postingan</button>
                </form>
                <div id="statusUpload" class="hidden mt-4 text-center text-sm font-bold text-primary"></div>
            </div>
        </div>

        <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
            Daftar Postingan <div class="badge badge-secondary" id="postCount">0</div>
        </h2>
        
        <div id="postsList" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="skeleton w-full h-32"></div>
        </div>
    </div>

        <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const firebaseConfig = { 
            apiKey: "AIzaSyAIImmquRs6nQ3dlY9EF-9oodVi53eoB0A",
            authDomain: "keyjell.firebaseapp.com",
            projectId: "keyjell",
            storageBucket: "keyjell.firebasestorage.app",
            messagingSenderId: "453410649070",
            appId: "1:453410649070:web:58a3c49253c210e512d4ff"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const supabaseUrl = 'https://ouzvbeudwmzhnwcgrqah.supabase.co';
        const supabaseKey = 'sb_publishable_z6NTv-MfTdrZTlDrltVKxw_nKMwthLG';
        const supabase = createClient(supabaseUrl, supabaseKey);

        // Cek login admin
        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = "../login";
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            auth.signOut();
        });

        const uploadForm = document.getElementById('uploadForm');
        const statusUpload = document.getElementById('statusUpload');

        // --- FUNGSI UPLOAD ---
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const files = document.getElementById('fileInput').files;
            const caption = document.getElementById('captionInput').value;
            const submitBtn = document.getElementById('submitBtn');

            if(files.length === 0) return;
            
            submitBtn.disabled = true;
            statusUpload.classList.remove('hidden');
            
            const urls = [];

            try {
                for (let i = 0; i < files.length; i++) {
                    statusUpload.innerText = `Mengupload file ${i+1} dari ${files.length}...`;
                    const file = files[i];
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Date.now()}-${Math.random().toString(36).substring(7)}.${fileExt}`;
                    const filePath = `gallery/${fileName}`;

                    // Upload ke Storage
                    const { error: storageError } = await supabase.storage
                        .from('gallery')
                        .upload(filePath, file);

                    if (storageError) throw storageError;

                    // Dapatkan URL Publik
                    const { data: { publicUrl } } = supabase.storage.from('gallery').getPublicUrl(filePath);
                    urls.push(publicUrl);
                }

                // Insert ke DB (Gunakan image_url agar sinkron dengan public page)
                const { error: dbError } = await supabase
                    .from('posts')
                    .insert([{ 
                        caption: caption, 
                        image_url: JSON.stringify(urls), // Jadikan format JSON String
                        likes: 0 
                    }]);

                if (dbError) throw dbError;

                alert("Postingan berhasil diupload!");
                uploadForm.reset();
                loadAdminPosts();
            } catch (err) {
                console.error("Upload error:", err);
                alert("Gagal: " + err.message);
            } finally {
                submitBtn.disabled = false;
                statusUpload.classList.add('hidden');
                statusUpload.innerText = '';
            }
        });

        // --- FUNGSI LOAD POSTINGAN ---
        async function loadAdminPosts() {
            const { data: posts, error } = await supabase.from('posts').select('*').order('created_at', { ascending: false });
            const postsList = document.getElementById('postsList');
            
            if (error) {
                postsList.innerHTML = `<div class="text-error">Gagal memuat: ${error.message}</div>`;
                return;
            }

            postsList.innerHTML = "";
            document.getElementById('postCount').innerText = posts ? posts.length : 0;

            if (!posts || posts.length === 0) {
                postsList.innerHTML = "<div class="col-span-full opacity-50">Belum ada postingan.</div>";
                return;
            }

            posts.forEach((post) => {
                let urls = [];
                
                // Ekstrak URL dengan aman (mendukung format lama dan baru)
                if (post.image_url) {
                    try {
                        urls = typeof post.image_url === 'string' && post.image_url.startsWith('[') 
                            ? JSON.parse(post.image_url) 
                            : [post.image_url];
                    } catch (e) {
                        urls = [post.image_url];
                    }
                } else if (post.media_urls) {
                    urls = post.media_urls.map(m => m.url || m);
                }

                const firstMediaUrl = urls.length > 0 ? urls[0] : 'https://placehold.co/100x100/eeeeee/999999?text=Error';
                const isVideo = firstMediaUrl && typeof firstMediaUrl === 'string' && firstMediaUrl.match(/\.(mp4|webm|mov)$/i);
                
                // Encode URLs untuk dikirim ke fungsi delete lewat HTML
                const encodedUrls = encodeURIComponent(JSON.stringify(urls));
                
                postsList.innerHTML += `
                    <div class="card card-side bg-base-100 shadow-sm border p-2 items-center gap-4 animate__animated animate__fadeIn">
                        <figure class="w-20 h-20 flex-none bg-base-300 rounded overflow-hidden">
                            ${isVideo 
                                ? '<div class="text-xs p-2 font-bold text-center mt-6">VIDEO</div>' 
                                : `<img src="${firstMediaUrl}" class="object-cover h-full w-full" onerror="this.src='https://placehold.co/100x100/ffeeee/ff0000?text=Error'" />`}
                        </figure>
                        <div class="flex-1 overflow-hidden">
                            <p class="text-xs font-bold text-primary">${urls.length} Media</p>
                            <p class="text-sm italic truncate">"${post.caption || 'Tanpa caption'}"</p>
                            <div class="card-actions justify-end mt-2">
                                <button onclick="deletePost(${post.id}, '${encodedUrls}')" class="btn btn-error btn-xs btn-outline">Hapus</button>
                            </div>
                        </div>
                    </div>`;
            });
        }

        // --- FUNGSI HAPUS POSTINGAN ---
        window.deletePost = async (id, encodedUrls) => {
            if (!confirm("Yakin ingin menghapus momen ini secara permanen?")) return;
            
            try {
                // Hapus data dari Database
                await supabase.from('posts').delete().eq('id', id);

                // Decode dan hapus file dari Storage
                const urls = JSON.parse(decodeURIComponent(encodedUrls));
                const pathsToDelete = urls.map(url => {
                    // Ekstrak path dari URL Supabase (membuang awalan public URL)
                    const marker = '/public/gallery/';
                    const idx = url.indexOf(marker);
                    if (idx !== -1) return url.substring(idx + marker.length);
                    return null;
                }).filter(Boolean); // Buang yang null

                if (pathsToDelete.length > 0) {
                    await supabase.storage.from('gallery').remove(pathsToDelete);
                }

                loadAdminPosts();
            } catch (err) {
                console.error("Gagal menghapus:", err);
                alert("Gagal menghapus postingan.");
            }
        };

        // Inisiasi awal
        loadAdminPosts();
    </script>
</body>
</html>
